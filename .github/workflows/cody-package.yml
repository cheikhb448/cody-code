name: Cody Code - Versions installables

on:
  workflow_dispatch:
  push:
    branches: [cody-main]
    paths:
      - '.github/workflows/cody-package.yml'
      - 'cody-tests/phase8-bureau.mjs'
      - 'build/gulpfile.vscode.ts'
      - 'src/vs/workbench/electron-browser/**'
      - 'build/linux/**'

permissions:
  contents: write   # captures d écran (branches ci-captures) et publication des fichiers de test

jobs:
  linux:
    name: Linux (x64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      VSCODE_SKIP_PRELAUNCH: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_AUDIT: 'false'
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Libérer de la place sur le disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | cat

      - name: Ajouter de la mémoire de secours (swap)
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Installer Node (version exigée par le projet)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Installer les bibliothèques système
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbfile-dev libsecret-1-dev libkrb5-dev libx11-dev libgbm1 \
            xvfb fakeroot dpkg-dev libgtk-3-0t64 libnss3 libasound2t64 libxss1 libatk-bridge2.0-0t64 libxkbfile1 libsecret-1-0 libdrm2 libxdamage1 libcups2t64

      - name: Installer les dépendances
        run: |
          set -e
          for i in 1 2 3; do
            npm ci && break
            if [ "$i" -eq 3 ]; then echo "npm ci a échoué 3 fois" >&2; exit 1; fi
          done
          npm cache clean --force || true

      - name: Retirer ce qui ne fait pas partie de Cody Code (Copilot, extensions de test Microsoft)
        run: |
          rm -rf extensions/copilot   # les extensions de test Microsoft sont exclues par l'empaquetage lui-même
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('product.json','utf8'));p.commit=process.env.GITHUB_SHA;fs.writeFileSync('product.json',JSON.stringify(p,null,2))"

      - name: Télécharger les extensions intégrées libres
        continue-on-error: true
        run: npm run download-builtin-extensions

      - name: Construire la version Linux
        run: |
          set -o pipefail
          mkdir -p /tmp/cody-logs
          npm run gulp vscode-linux-x64 2>&1 | tee /tmp/cody-logs/build-linux.log | tail -n 60
          ls "$(dirname "$GITHUB_WORKSPACE")/VSCode-linux-x64" | head -30
          df -h / | cat

      - name: Installer le navigateur de test
        run: npm install --no-save --prefix /tmp/pw playwright

      - name: Test - la version installée démarre
        run: xvfb-run -a node cody-tests/phase8-bureau.mjs "$(dirname "$GITHUB_WORKSPACE")/VSCode-linux-x64"

      - name: Fabriquer le paquet .deb
        continue-on-error: true
        run: |
          npm run gulp vscode-linux-x64-prepare-deb
          npm run gulp vscode-linux-x64-build-deb
          find .build/linux -name '*.deb' | head

      - name: Archiver la version Linux
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")"
          tar -czf "$GITHUB_WORKSPACE/cody-code-linux-x64.tar.gz" VSCode-linux-x64
          ls -lh "$GITHUB_WORKSPACE/cody-code-linux-x64.tar.gz"

      - name: Publier les captures d'écran (branche ci-captures)
        if: always()
        run: |
          set -e
          mkdir -p /tmp/captures
          cp /tmp/cody-logs/*.png /tmp/captures/ 2>/dev/null || true
          cd /tmp/captures
          git init -q
          git checkout -q -b ci-captures
          git config user.name "Cody CI"
          git config user.email "ci@cody-code.local"
          git add -A
          git commit -q -m "Captures du paquet ${{ github.run_id }}" || exit 0
          git fetch -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-captures || true
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-captures

      - name: Envoyer le paquet
        uses: actions/upload-artifact@v4
        with:
          name: cody-code-linux-x64
          path: |
            cody-code-linux-x64.tar.gz
            .build/linux/deb/**/*.deb
          if-no-files-found: warn
          retention-days: 14

      - name: Envoyer les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-paquet
          path: /tmp/cody-logs
          if-no-files-found: ignore

  windows:
    name: Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      VSCODE_SKIP_PRELAUNCH: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_AUDIT: 'false'
      CODY_TMP: C:/cody-tmp
      CODY_LOGS: C:/cody-tmp/logs
      PW_PATH: C:/cody-tmp/pw/node_modules/playwright/index.mjs
    steps:
      - name: Autoriser les chemins longs
        run: git config --system core.longpaths true

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node (version exigée par le projet)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Installer les dépendances
        run: |
          set -e
          for i in 1 2 3; do
            npm ci && break
            if [ "$i" -eq 3 ]; then echo "npm ci a échoué 3 fois" >&2; exit 1; fi
          done

      - name: Retirer Copilot et fixer la version
        run: |
          rm -rf extensions/copilot
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('product.json','utf8'));p.commit=process.env.GITHUB_SHA;fs.writeFileSync('product.json',JSON.stringify(p,null,2))"

      - name: Télécharger les extensions intégrées libres
        continue-on-error: true
        run: npm run download-builtin-extensions

      - name: Construire la version Windows
        run: |
          set -o pipefail
          mkdir -p "$CODY_LOGS"
          # signtool.exe (kit de développement Windows) est requis par la construction pour retirer d'anciennes signatures
          SIGNDIR=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64 | sort -V | tail -1)
          echo "signtool : $SIGNDIR"
          export PATH="$SIGNDIR:$PATH"
          npm run gulp vscode-win32-x64 2>&1 | tee "$CODY_LOGS/build-win.log" | tail -n 60
          ls "$(dirname "$GITHUB_WORKSPACE")/VSCode-win32-x64" | head -30

      - name: Installer le navigateur de test
        run: npm install --no-save --prefix C:/cody-tmp/pw playwright

      - name: Test - la version Windows démarre
        run: node cody-tests/phase8-bureau.mjs "$(dirname "$GITHUB_WORKSPACE")/VSCode-win32-x64" "Cody Code.exe"

      - name: Fabriquer l'installateur Windows
        if: always()
        continue-on-error: true
        run: |
          SIGNDIR=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"*/x64 | sort -V | tail -1)
          export PATH="$SIGNDIR:$PATH"
          npm run gulp vscode-win32-x64-inno-updater
          npm run gulp vscode-win32-x64-user-setup
          ls -la .build/win32-x64/user-setup | head

      - name: Archiver la version Windows (zip)
        if: always()
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")"
          powershell -NoProfile -Command "Compress-Archive -Path VSCode-win32-x64 -DestinationPath '$GITHUB_WORKSPACE/cody-code-win32-x64.zip'"
          ls -la "$GITHUB_WORKSPACE/cody-code-win32-x64.zip"

      - name: Publier les captures d'écran Windows (branche ci-captures-win)
        if: always()
        run: |
          set -e
          mkdir -p C:/cody-tmp/captures-w && cp C:/cody-tmp/logs/*.png C:/cody-tmp/captures-w/ 2>/dev/null || exit 0
          cd C:/cody-tmp/captures-w
          git init -q
          git checkout -q -b ci-captures-win
          git config user.name "Cody CI"
          git config user.email "ci@cody-code.local"
          git add -A
          git commit -q -m "Captures Windows ${{ github.run_id }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-captures-win || true

      - name: Envoyer le paquet Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cody-code-win32-x64
          path: |
            cody-code-win32-x64.zip
            .build/win32-x64/user-setup/*.exe
          if-no-files-found: warn
          retention-days: 14

      - name: Envoyer les journaux Windows
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-windows
          path: C:/cody-tmp/logs
          if-no-files-found: ignore

  publier:
    name: Publier les fichiers à télécharger
    needs: [linux, windows]
    if: always() && (needs.linux.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-24.04
    steps:
      - name: Récupérer les paquets
        uses: actions/download-artifact@v4
        with:
          path: paquets
          pattern: cody-code-*

      - name: Créer la publication (privée, test)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          find paquets -type f | head -20
          TAG="test-${{ github.run_number }}"
          FILES=$(find paquets -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.deb' -o -name '*.exe' \))
          gh release create "$TAG" $FILES --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "Cody Code - version de test $TAG" \
            --notes "Version de test construite automatiquement. Windows : télécharge le .zip, extrais-le, ouvre « Cody Code.exe » (Windows peut afficher un avertissement car la version n'est pas signée). Linux : .tar.gz."
