name: Cody Code - Construction et test de démarrage

on:
  workflow_dispatch:
  push:
    branches: [cody-main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  build:
    name: Construire et lancer Cody Code (version web)
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # uniquement pour publier les captures d'écran sur la branche ci-captures
    timeout-minutes: 120
    env:
      VSCODE_SKIP_PRELAUNCH: '1'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      NPM_CONFIG_FUND: 'false'
      NPM_CONFIG_AUDIT: 'false'
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Libérer de la place sur le disque
        run: |
          df -h / | cat
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h / | cat

      - name: Ajouter de la mémoire de secours (swap)
        run: |
          set -e
          free -h; df -h / /mnt | cat
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Installer Node (version exigée par le projet)
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Installer les bibliothèques système
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbfile-dev libsecret-1-dev libkrb5-dev libx11-dev libgbm1

      - name: Installer les dépendances
        run: |
          set -e
          for i in 1 2 3; do
            npm ci && break
            if [ "$i" -eq 3 ]; then echo "npm ci a échoué 3 fois" >&2; exit 1; fi
            echo "npm ci a échoué ($i), nouvel essai..."
          done

      - name: Vider le cache npm (gagner de la place)
        run: |
          npm cache clean --force || true
          df -h / | cat

      - name: Compiler l'éditeur (version légère)
        run: |
          npm run gulp copy-codicons
          npm run transpile-client
          ls out/vs/base/browser/ui/codicons/codicon/ | head
          free -h

      - name: Compiler les extensions intégrées et copier les icônes
        run: |
          npm run build-fast-extensions
          df -h / | cat

      - name: Récupérer Node pour le serveur
        run: npm run gulp node

      - name: Lancer le serveur web Cody Code
        run: |
          set -e
          mkdir -p /tmp/cody-logs /tmp/cody-data/data/Machine
          # Interface en français : installer le paquet de langue (magasin libre Open VSX)
          ./scripts/code-server.sh --server-data-dir /tmp/cody-data --install-extension MS-CEINTL.vscode-language-pack-fr > /tmp/cody-logs/install-fr.log 2>&1 || true
          echo "::notice title=Paquet français::$(tail -3 /tmp/cody-logs/install-fr.log | tr '\n' ' ')"
          find /tmp/cody-data -maxdepth 4 -iname '*language-pack*' | head -3 | while read d; do echo "::notice title=Dossier paquet::$d"; done
          # Compilation « empaquetée » avec les textes traduisibles (nécessaire pour le français)
          node build/next/index.ts bundle --nls --target server-web --out out-nls > /tmp/cody-logs/bundle.log 2>&1 || true
          # Seule la partie « fenêtre de l'éditeur » (navigateur) est remplacée par la version empaquetée avec textes traduisibles
          mkdir -p out/vs/code/browser/workbench
          cp -r out-nls/vs/code/browser/workbench/. out/vs/code/browser/workbench/
          echo "::notice title=Bundle fichiers::$(ls out-nls/vs/code/browser/workbench | tr '\n' ' ') | $(find out-nls -name '*.ttf' | tr '\n' ' ') | $(find out-nls/vs -maxdepth 3 -type d | head -30 | tr '\n' ' ')"
          mkdir -p out/media && cp -r out-nls/media/. out/media/
          cp out-nls/nls.keys.json out-nls/nls.messages.json out-nls/nls.messages.js out/
          echo "::notice title=Bundle fin::$(tail -3 /tmp/cody-logs/bundle.log | tr '\n' ' ')"
          node build/cody/make-nls-fr.mjs /tmp/cody-data > /tmp/cody-logs/nls-fr.log 2>&1 || true
          echo "::notice title=Génération français::$(cat /tmp/cody-logs/nls-fr.log | tr '\n' ' ')"
          # La version empaquetée connaît son numéro de commit : le serveur doit le connaître aussi (adresses identiques)
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('product.json','utf8'));p.commit=process.env.GITHUB_SHA;fs.writeFileSync('product.json',JSON.stringify(p,null,2))"
          # Test uniquement : pas de fenêtre de confiance (le produit garde cette protection active)
          nohup ./scripts/code-server.sh --host 127.0.0.1 --port 8080 --server-data-dir /tmp/cody-data --disable-workspace-trust --without-connection-token --accept-server-license-terms > /tmp/cody-logs/server.log 2>&1 &
          echo $! > /tmp/cody-logs/server.pid
          for i in $(seq 1 24); do
            code=$(curl -s -o /tmp/cody-logs/index.html -w '%{http_code}' http://127.0.0.1:8080/ || true)
            echo "essai $i : HTTP $code"
            if [ "$code" = "200" ]; then break; fi
            sleep 5
          done
          if [ "$code" != "200" ]; then
            echo "::error title=Serveur::$(tail -c 1800 /tmp/cody-logs/server.log | tr '\n' ' ')"
          fi
          test "$code" = "200"

      - name: Vérifier que la page de l'éditeur est bien là
        run: |
          set -e
          head -c 600 /tmp/cody-logs/index.html
          grep -qi "workbench" /tmp/cody-logs/index.html

      - name: Installer le navigateur de test
        run: |
          npm install --no-save --prefix /tmp/pw playwright
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium

      - name: Test - ouvrir, écrire et sauvegarder un fichier
        run: node cody-tests/phase1-ecrire-sauver.mjs

      - name: Test - identité Cody Code (nom, icône, À propos)
        if: always()
        run: node cody-tests/phase2-identite.mjs

      - name: Test - design Cody (couleurs + capture d'écran)
        if: always()
        run: node cody-tests/phase3-design.mjs

      - name: Test - panneau Cody Assistant
        if: always()
        run: node cody-tests/phase4-assistant.mjs

      - name: Test - fonctions de l'éditeur (phase 5.1)
        if: always()
        run: node cody-tests/phase5-editeur.mjs

      - name: Test - intelligence du code et explorateur (phase 5.2)
        if: always()
        run: node cody-tests/phase5-code-explorateur.mjs

      - name: Test - terminal et Git (phase 5.3)
        if: always()
        run: node cody-tests/phase5-terminal-git.mjs

      - name: Test - outils, personnalisation, productivité (phase 5.4)
        if: always()
        run: node cody-tests/phase5-outils.mjs

      - name: Vérification du code Cody (types TypeScript)
        if: always()
        continue-on-error: true
        timeout-minutes: 30
        run: |
          export NODE_OPTIONS=--max-old-space-size=6144
          npm run typecheck-client > /tmp/cody-logs/typecheck.log 2>&1 || true
          n=$(grep -c "error TS" /tmp/cody-logs/typecheck.log || true)
          echo "::notice title=Types TypeScript::$n erreur(s) ; fin du journal : $(tail -c 300 /tmp/cody-logs/typecheck.log | tr '\n' ' ')"
          grep "error TS" /tmp/cody-logs/typecheck.log | grep -i "cody\|titlebar\|webClientServer\|explorerViewer\|outline.contribution\|timeline.contribution\|workbenchThemeService\|themeConfiguration\|commandCenter" | head -10 | while read l; do echo "::error title=Type::$l"; done

      - name: Publier les captures d'écran (branche ci-captures)
        if: always()
        run: |
          set -e
          mkdir -p /tmp/captures
          cp /tmp/cody-logs/*.png /tmp/captures/ 2>/dev/null || true
          cd /tmp/captures
          ls -la
          git init -q
          git checkout -q -b ci-captures
          git config user.name "Cody CI"
          git config user.email "ci@cody-code.local"
          git add -A
          git commit -q -m "Captures du run ${{ github.run_id }}" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-captures

      - name: Envoyer les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-cody
          path: /tmp/cody-logs
          if-no-files-found: ignore
